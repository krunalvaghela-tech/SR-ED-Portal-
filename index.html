<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SR&amp;ED Records Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<link rel="preconnect" href="https://images.unsplash.com">
<meta name="theme-color" content="#234E4B">
<link rel="stylesheet" href="assets/app.css?v=20261127w">
</head>
<body>
<span id="top-sentinel" aria-hidden="true"></span>
<div id="gate" class="gate" hidden></div>

<div class="app" id="appShell" data-side="open">
  <aside class="side" id="side" aria-label="Portal navigation">
    <div class="side-head">
      <a class="brand" href="#overview" aria-label="SR&amp;ED Records, overview">
        <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="4" width="18" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 12h8M12 17h8M12 22h5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span>
        <span class="brand-name">SR&amp;ED Records</span>
      </a>
      <button class="icon-btn side-toggle" id="sideToggle" type="button" aria-controls="side" aria-expanded="true" title="Hide sidebar (Ctrl or Cmd + B)">
        <span class="sr">Hide sidebar</span><span data-icon="sidebar-simple"></span>
      </button>
    </div>
    <div class="side-org" id="sideOrg"></div>
    <nav class="tabs" id="nav" aria-label="Binder sections"></nav>
    <div class="side-foot meta" id="sideMeta"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main-col">
    <div class="banner" role="note">
      <span><strong>Demo with sample data.</strong> Every business, person and amount here is made up. Changes are not saved.</span>
      <button type="button" data-act="reset" data-fk="reset">Reset sample data</button>
    </div>
    <header class="topbar">
      <button class="icon-btn open-side" id="openSide" type="button" aria-controls="side" title="Show sidebar (Ctrl or Cmd + B)">
        <span class="sr">Show sidebar</span><span data-icon="sidebar-simple"></span>
      </button>
      <div class="greet"><span class="greet-date" id="greetDate"></span><strong class="greet-t" id="greetTitle">Welcome back</strong></div>
      <div class="top-tools">
        <button class="tool-btn search-pill" id="cmdBtn" type="button" aria-haspopup="dialog" title="Search (Ctrl or Cmd + K)"><span data-icon="magnifying-glass"></span><span class="tool-label">Search</span><kbd>⌘K</kbd></button>
        <button class="icon-btn tool-icon" id="helpBtn" type="button" aria-haspopup="dialog" title="Help and training"><span class="sr">Help and training</span><span data-icon="question"></span></button>
        <div class="bell-wrap"><button class="icon-btn" id="bellBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="bellPop" title="Notifications"><span class="sr">Notifications</span><span data-icon="bell"></span><span class="bell-n" id="bellN" hidden></span></button>
          <div class="bell-pop" id="bellPop" hidden></div></div>
        <div class="user-chip" id="userChip"></div>
      </div>
    </header>
    <div class="shell">
      <main id="app" tabindex="-1"></main>
    </div>
    <footer class="foot">
      <p>This portal organizes your SR&amp;ED records. It does not decide whether work qualifies or prepare the claim: your accountant or SR&amp;ED advisor makes those calls.</p>
    </footer>
  </div>
</div>

<button class="to-top" id="toTop" type="button" aria-label="Back to top">&uarr;</button>
<div class="cmd" id="cmd" hidden>
  <div class="cmd-scrim" data-cmd-close></div>
  <div class="cmd-box" role="dialog" aria-modal="true" aria-label="Search the portal">
    <div class="cmd-in"><span data-icon="magnifying-glass"></span><input id="cmdInput" type="text" placeholder="Search pages, projects and actions" autocomplete="off" aria-controls="cmdList" aria-activedescendant=""><kbd>Esc</kbd></div>
    <ul class="cmd-list" id="cmdList" role="listbox"></ul>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
<script src="config.js?v=20261127w" defer></script>
<script src="assets/icons.js?v=20261127w" defer></script>
<script src="assets/guide.js?v=20261127w" defer></script>
<script src="assets/help.js?v=20261127w" defer></script>
<script src="assets/claim.js?v=20261127w" defer></script>
<script src="assets/app.js?v=20261127w" defer></script>
</body>
</html>
